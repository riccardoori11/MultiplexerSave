<script id="repository" type="application/json">{"files": {".gitignore": "/build/\n/build-cmake/\n__pycache__/\n*.pyc\n", "CMakeLists.txt": "cmake_minimum_required(VERSION 3.20)\nproject(work VERSION 0.1.0 LANGUAGES CXX)\n\nif(NOT CMAKE_SYSTEM_NAME STREQUAL \"Linux\")\n  message(FATAL_ERROR \"work currently supports Linux.\")\nendif()\nadd_executable(work src/main.cpp src/process.cpp src/project.cpp)\ntarget_include_directories(work PRIVATE include)\ntarget_compile_features(work PRIVATE cxx_std_20)\ntarget_compile_options(work PRIVATE -Wall -Wextra -Wpedantic -Wconversion -Wshadow)\ninclude(GNUInstallDirs)\ninstall(TARGETS work RUNTIME DESTINATION ${CMAKE_INSTALL_BINDIR})\ninstall(FILES completions/bash/work\n  DESTINATION ${CMAKE_INSTALL_DATADIR}/bash-completion/completions)\n", "Makefile": "CXX ?= g++\nCPPFLAGS += -Iinclude\nCXXFLAGS ?= -std=c++20 -O2 -g -Wall -Wextra -Wpedantic -Wconversion -Wshadow\nPREFIX ?= $(HOME)/.local\nSOURCES := src/main.cpp src/process.cpp src/project.cpp\nHEADERS := $(wildcard include/work/*.hpp)\n\n.PHONY: all install clean\nall: build/work\n\nbuild/work: $(SOURCES) $(HEADERS)\n\tmkdir -p build\n\t$(CXX) $(CPPFLAGS) $(CXXFLAGS) $(SOURCES) $(LDFLAGS) -o $@\n\ninstall: build/work\n\tinstall -d \"$(DESTDIR)$(PREFIX)/bin\"\n\tinstall -m 755 build/work \"$(DESTDIR)$(PREFIX)/bin/work\"\n\tinstall -d \"$(DESTDIR)$(PREFIX)/share/bash-completion/completions\"\n\tinstall -m 644 completions/bash/work \"$(DESTDIR)$(PREFIX)/share/bash-completion/completions/work\"\n\nclean:\n\trm -rf build\n", "README.md": "# work\n\nA Linux workspace manager built with C++20, tmuxinator, and tmux-resurrect.\n`work` gives each project its own tmux server and saved workspace. Opening a\nproject reconnects to its running workspace, restores its snapshot, or creates\nits configured windows and panes.\n\n## Requirements\n\n- Linux and a C++20 compiler.\n- Make, or CMake 3.20 or newer.\n- tmux, tmuxinator, Bash, and a tmux-resurrect checkout at runtime.\n\n\n## Development and testing\n\nThe application is implemented in C++20. The repository no longer contains a\ntest suite or test build targets. The former Python integration and live smoke\ntests remain in git history at commit `1e2336f`.\n\nBuild with `make -j`, or use CMake:\n\n```sh\ncmake -S . -B build-cmake\ncmake --build build-cmake\n```\n", "compile_flags.txt": "-std=c++20\n-Iinclude\n", "completions/bash/work": "# Bash completion for work. Can also be sourced directly from ~/.bashrc.\n_work_project_names() (\n    local config_dir path name LC_ALL=C\n    [[ -n ${HOME:-} ]] || return 0\n    if [[ -n ${WORK_CONFIG_HOME:-} ]]; then\n        config_dir=$WORK_CONFIG_HOME\n    elif [[ -n ${XDG_CONFIG_HOME:-} ]]; then\n        [[ $XDG_CONFIG_HOME == /* ]] || return 0\n        config_dir=$XDG_CONFIG_HOME/work\n    else\n        config_dir=$HOME/.config/work\n    fi\n\n    # Keep glob settings local to this subshell.\n    unset GLOBIGNORE\n    shopt -s nullglob\n    shopt -u failglob dotglob nocaseglob\n    for path in \"$config_dir\"/projects/*.work; do\n        [[ -f $path ]] || continue\n        name=${path##*/}\n        name=${name%.work}\n        [[ $name =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]{0,47}$ ]] || continue\n        printf '%s\\n' \"$name\"\n    done\n)\n\n_work_add_matches() {\n    # Usage: _work_add_matches CUR WORD...; appends WORDs starting with CUR.\n    local cur=$1 word\n    shift\n    for word in \"$@\"; do\n        if [[ $word == \"$cur\"* ]]; then COMPREPLY+=(\"$word\"); fi\n    done\n}\n\n_work() {\n    COMPREPLY=()\n    local cur=\"${COMP_WORDS[COMP_CWORD]-}\" command=\"${COMP_WORDS[1]-}\"\n    local word candidate i have_name=0 have_all=0\n    local -a options=() unused=() names=()\n\n    if (( COMP_CWORD == 1 )); then\n        if [[ $cur == -* ]]; then\n            _work_add_matches \"$cur\" --help --version\n        else\n            _work_add_matches \"$cur\" open save kill init delete list config help\n        fi\n        return 0\n    fi\n\n    case \"$command\" in\n        open) options=(--no-attach --fresh) ;;\n        save) options=(--quiet --all) ;;\n        kill) ;;\n        delete|config)\n            # Exactly one project name.\n            (( COMP_CWORD == 2 )) && [[ $cur != -* ]] || return 0\n            while IFS= read -r candidate; do names+=(\"$candidate\"); done \\\n                \u003c \u003c(_work_project_names 2>/dev/null)\n            _work_add_matches \"$cur\" \"${names[@]}\"\n            return 0\n            ;;\n        init)\n            # work init NAME [--root DIRECTORY]; NAME is new, so nothing to suggest.\n            if (( COMP_CWORD == 3 )); then\n                _work_add_matches \"$cur\" --root\n            elif (( COMP_CWORD == 4 )) && [[ ${COMP_WORDS[3]-} == --root ]]; then\n                compopt -o filenames 2>/dev/null\n                while IFS= read -r candidate; do COMPREPLY+=(\"$candidate\"); done \\\n                    \u003c \u003c(compgen -d -- \"$cur\")\n            fi\n            return 0\n            ;;\n        *) return 0 ;;\n    esac\n\n    # open, save and kill: one optional project name plus their options, in any order.\n    for ((i = 2; i \u003c COMP_CWORD; ++i)); do\n        word=${COMP_WORDS[i]}\n        [[ $word == -* ]] || have_name=1\n        [[ $word == --all ]] && have_all=1\n    done\n    for word in \"${options[@]}\"; do\n        for ((i = 2; i \u003c COMP_CWORD; ++i)); do\n            [[ ${COMP_WORDS[i]} == \"$word\" ]] && continue 2\n        done\n        # --all replaces the project name, so it can't follow one.\n        [[ $word == --all ]] && (( have_name )) && continue\n        unused+=(\"$word\")\n    done\n\n    if [[ $cur == -* ]] || (( have_name || have_all )); then\n        _work_add_matches \"$cur\" \"${unused[@]}\"\n    else\n        while IFS= read -r candidate; do names+=(\"$candidate\"); done \\\n            \u003c \u003c(_work_project_names 2>/dev/null)\n        _work_add_matches \"$cur\" \"${names[@]}\"\n    fi\n    return 0\n}\n# Leave filename fallback disabled, including when no project matches.\ncomplete -F _work work\n", "contrib/systemd/work-autosave.service": "[Unit]\nDescription=Save running work projects\n\n[Service]\nType=oneshot\nExecStart=%h/.local/bin/work save --all --quiet\n", "contrib/systemd/work-autosave.timer": "[Unit]\nDescription=Save running work projects every 5 minutes\n\n[Timer]\nOnBootSec=5min\nOnUnitActiveSec=5min\nAccuracySec=30s\n\n[Install]\nWantedBy=timers.target\n", "contrib/systemd/work-save-on-shutdown.service": "[Unit]\nDescription=Save running work projects when the user session stops\n\n[Service]\nType=oneshot\nRemainAfterExit=yes\nExecStart=/bin/true\n# Best effort: tmux servers may already be stopping at the same time.\nExecStop=%h/.local/bin/work save --all --quiet\nTimeoutStopSec=60\n\n[Install]\nWantedBy=default.target\n", "docs/architecture/component-overview.mmd": "flowchart TD\n    User[\"User: work open / save / kill / init\"]\n    Main[\"main.cpp\u003cbr/>CLI and workspace coordination\"]\n    Project[\"project.cpp\u003cbr/>Configuration, paths, YAML, atomic writes\"]\n    Process[\"process.cpp\u003cbr/>Run external commands and capture results\"]\n    Files[(\"Configuration and state files\")]\n    Tmux[\"tmux\u003cbr/>Dedicated server per project\"]\n    Inator[\"tmuxinator\u003cbr/>Create initial workspace\"]\n    Resurrect[\"tmux-resurrect\u003cbr/>Save and restore workspace\"]\n    Apps[\"Windows and panes\u003cbr/>Shells, editors, other programs\"]\n\n    User --> Main\n    Main --> Project\n    Project \u003c--> Files\n    Main --> Process\n    Process --> Tmux\n    Process --> Inator\n    Process --> Resurrect\n    Inator --> Tmux\n    Resurrect \u003c--> Tmux\n    Resurrect \u003c--> Files\n    Tmux --> Apps\n    Tmux -. \"Detach hook invokes work save\" .-> Main\n", "docs/architecture/open-project.mmd": "flowchart TD\n    Open[\"work open demo\"] --> Config[\"Lock project and read configuration\"]\n    Config --> Running{\"Server already running?\"}\n    Running -- Yes --> Reuse[\"Reuse workspace\"]\n    Running -- No --> Saved{\"Snapshot exists\u003cbr/>and --fresh is absent?\"}\n    Saved -- Yes --> Restore[\"Start server and restore\u003cbr/>using tmux-resurrect\"]\n    Saved -- No --> Create[\"Create configured layout\u003cbr/>using tmuxinator\"]\n    Restore --> Verify[\"Verify restored panes\"]\n    Reuse --> Finish[\"Remember project and release lock\"]\n    Verify --> Finish\n    Create --> Finish\n    Finish --> Attach[\"Attach unless --no-attach\"]\n", "include/work/process.hpp": "#pragma once\n\n#include \u003coptional>\n#include \u003cstring>\n#include \u003cutility>\n#include \u003cvector>\n\nnamespace work {\nusing Environment = std::vector\u003cstd::pair\u003cstd::string, std::optional\u003cstd::string>>>;\nstruct ProcessResult {\n    int exit_code{};\n    std::string output;\n};\nenum class OutputCapture { inherit, diagnostic, complete };\n// Runs an argument vector directly; no shell parses arguments.\n// Diagnostic capture retains the final 64 KiB of combined stdout/stderr.\n// Use complete capture for output that will be parsed as data.\nProcessResult run(const std::vector\u003cstd::string>& args, OutputCapture capture = OutputCapture::diagnostic,\n                  const Environment& environment = {});\nstd::optional\u003cstd::string> executable(const std::string& name);\nstd::string shell_quote(const std::string& value);\nstd::string tmux_quote(const std::string& value);\n}\n", "include/work/project.hpp": "#pragma once\n\n#include \u003cfilesystem>\n#include \u003cstring>\n#include \u003cvector>\n\nnamespace work {\nnamespace fs = std::filesystem;\nstruct Window {\n    std::string name;\n    std::string layout{\"main-vertical\"};\n    std::vector\u003cstd::string> panes;\n};\nstruct Project {\n    std::string name;\n    fs::path root;\n    bool editor_sessions{true};\n    std::string resurrect_processes;\n    std::vector\u003cWindow> windows;\n};\nstruct Paths {\n    fs::path config;\n    fs::path state;\n    fs::path project(const std::string& name) const;\n    fs::path project_state(const std::string& name) const;\n    fs::path snapshots(const std::string& name) const;\n    static Paths from_environment();\n};\nstd::string trim(std::string text);\nbool is_valid_name(const std::string& name);\nvoid validate_name(const std::string& name);\nfs::path existing_project_file(const Paths& paths, const std::string& name);\nProject read_project(const Paths& paths, const std::string& name);\nstd::string project_template(const fs::path& root);\nstd::string tmuxinator_yaml(const Project& project, const fs::path& config);\nvoid write_atomic(const fs::path& path, const std::string& content);\nstd::string read_file(const fs::path& path);\n}\n", "src/main.cpp": "#include \"work/process.hpp\"\n#include \"work/project.hpp\"\n\n#include \u003calgorithm>\n#include \u003ccerrno>\n#include \u003cchrono>\n#include \u003ccstdlib>\n#include \u003ccstring>\n#include \u003cfcntl.h>\n#include \u003ciostream>\n#include \u003cmap>\n#include \u003coptional>\n#include \u003cset>\n#include \u003csstream>\n#include \u003cstdexcept>\n#include \u003csys/file.h>\n#include \u003csys/stat.h>\n#include \u003cthread>\n#include \u003cvector>\n#include \u003cunistd.h>\n\nnamespace work {\nnamespace {\nconstexpr const char* version = \"0.1.0\";\nclass ProjectLock {\npublic:\n    ProjectLock(const Paths& paths, const std::string& name) {\n        const auto dir = paths.project_state(name);\n        fs::create_directories(dir);\n        fd_ = ::open((dir / \"lock\").c_str(), O_CREAT | O_RDWR | O_CLOEXEC, 0600);\n        if (fd_ \u003c 0) throw std::runtime_error(\"Cannot open project lock: \" + std::string(std::strerror(errno)));\n        while (::flock(fd_, LOCK_EX) \u003c 0) {\n            if (errno == EINTR) continue;\n            ::close(fd_); fd_ = -1;\n            throw std::runtime_error(\"Cannot lock project.\");\n        }\n    }\n    ~ProjectLock() { if (fd_ >= 0) ::close(fd_); }\n    ProjectLock(const ProjectLock&) = delete;\n    ProjectLock& operator=(const ProjectLock&) = delete;\nprivate:\n    int fd_{-1};\n};\n\nstd::vector\u003cstd::string> tmux_args(const std::string& name, std::vector\u003cstd::string> args) {\n    std::vector\u003cstd::string> result{\"tmux\", \"-L\", \"work-\" + name};\n    result.insert(result.end(), args.begin(), args.end());\n    return result;\n}\nconst Environment clean_tmux{{\"TMUX\", std::nullopt}, {\"TMUX_PANE\", std::nullopt}};\nProcessResult tmux(const std::string& name, std::vector\u003cstd::string> args,\n                   OutputCapture capture = OutputCapture::diagnostic) {\n    return run(tmux_args(name, std::move(args)), capture, clean_tmux);\n}\nvoid require_executable(const std::string& name) {\n    if (!executable(name)) throw std::runtime_error(\"Missing dependency: \" + name + \". Install it and make sure it is on PATH.\");\n}\nvoid check(const ProcessResult& result, const std::string& context) {\n    if (result.exit_code != 0)\n        throw std::runtime_error(context + \" (exit \" + std::to_string(result.exit_code) + \")\\n\" + trim(result.output));\n}\nvoid tmux_check(const std::string& name, std::vector\u003cstd::string> args, const std::string& context) {\n    check(tmux(name, std::move(args)), context);\n}\nbool running(const std::string& name) { return tmux(name, {\"has-session\"}).exit_code == 0; }\n\nstd::optional\u003cfs::path> plugin_directory() {\n    if (const char* path = std::getenv(\"WORK_RESURRECT_DIR\"); path && *path) {\n        const auto dir = fs::absolute(path);\n        if (fs::is_regular_file(dir / \"resurrect.tmux\") && fs::is_regular_file(dir / \"scripts/save.sh\") &&\n            fs::is_regular_file(dir / \"scripts/restore.sh\")) return dir;\n        throw std::runtime_error(\"WORK_RESURRECT_DIR does not point to a tmux-resurrect checkout: \" + dir.string());\n    }\n    const fs::path user_home(std::getenv(\"HOME\"));\n    std::vector\u003cfs::path> candidates{user_home / \".tmux/plugins/tmux-resurrect\",\n                                   user_home / \".config/tmux/plugins/tmux-resurrect\"};\n    if (const char* xdg = std::getenv(\"XDG_CONFIG_HOME\"); xdg && *xdg)\n        candidates.insert(candidates.begin(), fs::path(xdg) / \"tmux/plugins/tmux-resurrect\");\n    for (const auto& dir : candidates) {\n        if (fs::is_regular_file(dir / \"resurrect.tmux\") && fs::is_regular_file(dir / \"scripts/save.sh\") &&\n            fs::is_regular_file(dir / \"scripts/restore.sh\")) return dir;\n    }\n    return std::nullopt;\n}\nfs::path require_plugin() {\n    const auto dir = plugin_directory();\n    if (!dir) throw std::runtime_error(\"tmux-resurrect was not found. Install it under ~/.tmux/plugins/tmux-resurrect, or set WORK_RESURRECT_DIR.\");\n    require_executable(\"bash\");\n    return *dir;\n}\nstd::string own_executable() {\n    return fs::read_symlink(\"/proc/self/exe\").string();\n}\nstd::string save_command(const Paths& paths, const std::string& name, const fs::path& plugin) {\n    return \"env WORK_CONFIG_HOME=\" + shell_quote(paths.config.string()) +\n           \" WORK_STATE_HOME=\" + shell_quote(paths.state.string()) +\n           \" WORK_RESURRECT_DIR=\" + shell_quote(plugin.string()) + \" \" +\n           shell_quote(own_executable()) + \" save \" + shell_quote(name) + \" --quiet\";\n}\nvoid prepare_snapshot_directory(const Paths& paths, const std::string& name) {\n    const auto snapshot_path = paths.snapshots(name).string();\n    // Upstream resurrect currently uses unquoted file redirections for this path.\n    if (snapshot_path.find_first_of(\" \\t\\r\\n\") != std::string::npos)\n        throw std::runtime_error(\"tmux-resurrect requires a state path without whitespace. Set WORK_STATE_HOME to a suitable directory.\");\n    fs::create_directories(snapshot_path);\n}\nvoid prepare_config(const Paths& paths, const Project& project) {\n    prepare_snapshot_directory(paths, project.name);\n    const auto dir = paths.project_state(project.name);\n    const auto snapshot_path = paths.snapshots(project.name).string();\n    std::ostringstream config;\n    config \u003c\u003c \"# Generated by work. Shared preferences belong in \" \u003c\u003c (paths.config / \"tmux.conf\").string() \u003c\u003c \"\\n\"\n           \u003c\u003c \"source-file -q \" \u003c\u003c tmux_quote((paths.config / \"tmux.conf\").string()) \u003c\u003c \"\\n\"\n           \u003c\u003c \"set-environment -g WORK_PROJECT \" \u003c\u003c tmux_quote(project.name) \u003c\u003c \"\\n\"\n           \u003c\u003c \"set-option -g @resurrect-dir \" \u003c\u003c tmux_quote(snapshot_path) \u003c\u003c \"\\n\";\n    write_atomic(dir / \"tmux.conf\", config.str());\n    write_atomic(dir / \"tmuxinator.yml\", tmuxinator_yaml(project, dir / \"tmux.conf\"));\n}\nvoid configure_server(const Paths& paths, const Project& project, const fs::path& plugin) {\n    const auto& name = project.name;\n    tmux_check(name, {\"set-option\", \"-g\", \"@resurrect-dir\", paths.snapshots(name).string()}, \"Cannot set snapshot directory\");\n    if (project.editor_sessions) {\n        tmux_check(name, {\"set-option\", \"-g\", \"@resurrect-strategy-vim\", \"session\"}, \"Cannot configure Vim sessions\");\n        tmux_check(name, {\"set-option\", \"-g\", \"@resurrect-strategy-nvim\", \"session\"}, \"Cannot configure Neovim sessions\");\n    } else {\n        (void)tmux(name, {\"set-option\", \"-gu\", \"@resurrect-strategy-vim\"});\n        (void)tmux(name, {\"set-option\", \"-gu\", \"@resurrect-strategy-nvim\"});\n    }\n    if (!project.resurrect_processes.empty())\n        tmux_check(name, {\"set-option\", \"-g\", \"@resurrect-processes\", project.resurrect_processes}, \"Cannot configure restored programs\");\n    else (void)tmux(name, {\"set-option\", \"-gu\", \"@resurrect-processes\"});\n    tmux_check(name, {\"run-shell\", \"bash \" + shell_quote((plugin / \"resurrect.tmux\").string())}, \"Cannot load tmux-resurrect\");\n    const auto command = save_command(paths, name, plugin);\n    tmux_check(name, {\"set-hook\", \"-g\", \"client-detached\", \"run-shell -b \" + tmux_quote(command)}, \"Cannot configure saving on detach\");\n    tmux_check(name, {\"bind-key\", \"C-s\", \"run-shell\", command}, \"Cannot configure save shortcut\");\n}\nEnvironment plugin_environment(const std::string& name) {\n    const auto context = tmux(name, {\"display-message\", \"-p\", \"#{socket_path},#{pid},0\"}, OutputCapture::complete);\n    check(context, \"Cannot identify project tmux server\");\n    const auto pane = tmux(name, {\"display-message\", \"-p\", \"#{pane_id}\"}, OutputCapture::complete);\n    check(pane, \"Cannot identify active pane\");\n    return {{\"TMUX\", trim(context.output)}, {\"TMUX_PANE\", trim(pane.output)}};\n}\nstd::vector\u003cstd::string> split_tabs(const std::string& line) {\n    std::vector\u003cstd::string> fields;\n    std::size_t start = 0;\n    for (;;) {\n        const auto end = line.find('\\t', start);\n        fields.push_back(line.substr(start, end == std::string::npos ? end : end - start));\n        if (end == std::string::npos) break;\n        start = end + 1;\n    }\n    return fields;\n}\nstd::set\u003cstd::string> saved_panes(const fs::path& last, bool check_directories) {\n    const auto text = read_file(last);\n    std::istringstream input(text);\n    std::string line;\n    std::set\u003cstd::string> result;\n    while (std::getline(input, line)) {\n        const auto fields = split_tabs(line);\n        if (fields.empty() || fields.front() != \"pane\") continue;\n        if (fields.size() \u003c 11 || fields[1].empty() || fields[2].empty() || fields[5].empty() ||\n            fields[7].empty() || fields[7][0] != ':')\n            throw std::runtime_error(\"Invalid pane record in \" + last.string() + \". The saved file was left untouched.\");\n        const auto dir = fields[7].substr(1);\n        if (check_directories && !fs::is_directory(dir))\n            throw std::runtime_error(\"Saved working directory no longer exists: \" + dir + \". Use --fresh to open the project configuration instead.\");\n        result.insert(fields[1] + \"\\t\" + fields[2] + \"\\t\" + fields[5]);\n    }\n    if (result.empty()) throw std::runtime_error(\"Snapshot has no valid panes: \" + last.string() + \". Use --fresh to open the project configuration instead.\");\n    return result;\n}\nstd::set\u003cstd::string> live_panes(const std::string& name) {\n    auto response = tmux(name, {\"list-panes\", \"-a\", \"-F\", \"#{session_name}\\t#{window_index}\\t#{pane_index}\"},\n                         OutputCapture::complete);\n    check(response, \"Cannot inspect restored panes\");\n    std::istringstream input(response.output);\n    std::set\u003cstd::string> result;\n    std::string line;\n    while (std::getline(input, line)) if (!line.empty()) result.insert(line);\n    return result;\n}\nvoid normalize_snapshot_directories(const std::string& name, const fs::path& last) {\n    const auto response = tmux(name, {\"list-panes\", \"-a\", \"-F\",\n        \"#{session_name}\\t#{window_index}\\t#{pane_index}\\t#{pane_current_path}\"}, OutputCapture::complete);\n    check(response, \"Cannot inspect saved directories\");\n    std::map\u003cstd::string, std::string> directories;\n    std::istringstream live(response.output);\n    std::string line;\n    while (std::getline(live, line)) {\n        const auto fields = split_tabs(line);\n        if (fields.size() != 4) throw std::runtime_error(\"Unsupported tab in a pane name or directory.\");\n        directories[fields[0] + \"\\t\" + fields[1] + \"\\t\" + fields[2]] = fields[3];\n    }\n    const auto original = read_file(last);\n    std::istringstream input(original);\n    std::ostringstream output;\n    while (std::getline(input, line)) {\n        auto fields = split_tabs(line);\n        if (fields.size() >= 11 && fields[0] == \"pane\") {\n            const auto key = fields[1] + \"\\t\" + fields[2] + \"\\t\" + fields[5];\n            const auto found = directories.find(key);\n            if (found == directories.end()) throw std::runtime_error(\"A saved pane no longer exists.\");\n            // Current resurrect versions escape spaces while saving. Restore\n            // uses quoted directory arguments; use the actual tmux path.\n            fields[7] = \":\" + found->second;\n            for (std::size_t i = 0; i \u003c fields.size(); ++i) {\n                if (i) output \u003c\u003c '\\t';\n                output \u003c\u003c fields[i];\n            }\n            output \u003c\u003c '\\n';\n        } else output \u003c\u003c line \u003c\u003c '\\n';\n    }\n    if (output.str() != original) write_atomic(fs::canonical(last), output.str());\n}\nvoid restore_selection(const std::string& name, const fs::path& last) {\n    // Resurrect normally runs inside an attached client. Its switch-client calls\n    // cannot select windows during our headless restore, so apply selections\n    // with explicit session/window/pane targets before attaching.\n    std::istringstream input(read_file(last));\n    std::vector\u003cstd::string> windows;\n    std::string line;\n    while (std::getline(input, line)) {\n        const auto fields = split_tabs(line);\n        if (fields.size() >= 11 && fields[0] == \"pane\" && fields[8] == \"1\") {\n            tmux_check(name, {\"select-pane\", \"-t\", \"=\" + fields[1] + \":\" + fields[2] + \".\" + fields[5]},\n                       \"Cannot restore active pane\");\n        } else if (fields.size() >= 8 && fields[0] == \"window\" &&\n                   (fields[4] == \"1\" || fields[5].find('*') != std::string::npos)) {\n            windows.push_back(\"=\" + fields[1] + \":\" + fields[2]);\n        }\n    }\n    for (const auto& target : windows)\n        tmux_check(name, {\"select-window\", \"-t\", target}, \"Cannot restore active window\");\n}\nstd::string current_project(const Paths& paths) {\n    if (const char* project = std::getenv(\"WORK_PROJECT\"); p const compactPositions={project:[62,99],files:[62,274],cli:[202,99],runner:[202,274],tmux:[349,55],inator:[349,174],resurrect:[349,293]};
const coords=id=>compactMap()?compactPositions[id]:components[id].pos;
const compactRoutes={'cli/project':['M164 98H95',131,88,'parse'],'project/files':['M62 147V242',60,197,'I/O'],'cli/runner':['M202 147V251',199,207,'run'],'runner/tmux':['M233 263H247Q254 263 254 256V68Q254 55 268 55H315',284,46,'query'],'runner/inator':['M234 271H263Q270 271 270 264V186Q270 174 281 174H316',295,165,'launch'],'runner/resurrect':['M232 278H263Q270 278 279 286Q285 293 293 293H316',289,282,'invoke']};
const overviewRoutes={
 'cli/project':['M353 106H192',272,98,'parse'],
 'project/files':['M147 165V224',147,198,'read / write'],
 'cli/runner':['M414 175V245',414,214,'dispatch'],
 'runner/tmux':['M461 263H515Q523 263 529 257L545 241Q551 235 551 227V75Q551 69 556 64L566 54Q571 49 577 49H653',599,41,'query'],
 'runner/inator':['M461 272H528Q535 272 541 266L563 244Q569 238 569 230V202Q569 196 574 191L587 178Q592 173 598 173H653',617,165,'launch'],
 'runner/resurrect':['M461 281H532Q540 281 547 287L555 294Q560 299 568 299H653',603,291,'invoke']
};
function routeFor(a,b){
 const routes=compactMap()?compactRoutes:overviewRoutes;
 const exact=routes[a+'/'+b];if(exact)return exact[0];
 const rev=routes[b+'/'+a];if(rev){const [x,y]=coords(a),[tx,ty]=coords(b);if(Math.abs(x-tx)<15)return 'M'+x+' '+(y-49)+'V'+(ty+65)}
 const [x,y]=coords(a),[tx,ty]=coords(b);
 if(a===b)return 'M'+(x-45)+' '+y+'q-27 -27 3 -45';
 if(Math.abs(x-tx)<50){const dir=(x<420?-1:1),ox=x+dir*69;return 'M'+(x+dir*38)+' '+y+' Q'+ox+' '+y+' '+ox+' '+(y+(ty-y)*.2)+' V'+(ty-(ty-y)*.2)+' Q'+ox+' '+ty+' '+(tx+dir*41)+' '+ty}
 const d=Math.sign(tx-x),sx=x+46*d,ex=tx-46*d;
 if(Math.abs(tx-x)>460){const cy=Math.max(y,ty)+84;return 'M'+sx+' '+y+' C'+(sx+90*d)+' '+cy+' '+(ex-90*d)+' '+cy+' '+ex+' '+ty}
 return 'M'+sx+' '+y+' C'+(sx+65*d)+' '+y+' '+(ex-65*d)+' '+ty+' '+ex+' '+ty;
}
function currentPair(){if(state.level===2)return contracts[state.contract].slice(0,2);if(state.level===3){const s=flows[state.flow].steps[state.step];return [s.from,s.to]}return null}
function wire(a,b,path,active,labels){const color=active?'#acedbc':b==='files'?'#9e87b7':components[b].kind==='External tool'?'#9c8665':'#6b9c81';
 const marker=active?'active':b==='files'?'storage':components[b].kind==='External tool'?'ext':'core';
 const title=esc(components[a].name+' → '+components[b].name);return '<g><title>'+title+'</title><path class="wire '+(active?'active':'')+'" d="'+path+'" stroke="'+color+'" opacity="'+(currentPair()&&!active?.29:.95)+'" marker-end="url(#arrow-'+marker+')"/>'+(active?'<circle class="pulse" r="3.6" fill="#d6ffe0"><animateMotion dur="2.4s" repeatCount="indefinite" path="'+path+'"/></circle>':'')+(labels?'<text class="wirelabel" x="'+(labels[0]+(a==='project'||b==='runner'?11:0))+'" y="'+labels[1]+'" text-anchor="'+(a==='project'||b==='runner'?'start':'middle')+'">'+labels[2]+'</text>':'')+'</g>'}
function diagram(){
 const pair=currentPair(),current=pair?pair[1]:state.node;
 const mobile=compactMap();
 const wires=Object.entries(mobile?compactRoutes:overviewRoutes).map(([k,r])=>{const [a,b]=k.split('/');return wire(a,b,r[0],false,pair?null:r.slice(1))}).join('');
 const markers=Object.entries({active:'#acedbc',core:'#719e85',ext:'#a68e6f',storage:'#a28abb'}).map(([k,col])=>'<marker id="arrow-'+k+'" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="'+col+'" stroke-width="1.2"/></marker>').join('');
 return '<svg id="graph" viewBox="'+(mobile?'0 -4 416 365':'0 -22 846 394')+'" aria-label="Interactive architecture map. Select components with Enter. Arrow keys pan the map." tabindex="0"><defs>'+markers+'<radialGradient id="halo"><stop stop-color="#88d99d" stop-opacity=".18"/><stop offset="1" stop-color="#88d99d" stop-opacity="0"/></radialGradient></defs><g id="camera">'+wires+(pair?wire(...pair,routeFor(...pair),true,null):'')+ids.map(id=>{const c=components[id],sel=current===id;return '<g role="button" aria-pressed="'+sel+'" tabindex="0" aria-label="Inspect '+esc(c.name)+'" data-node="'+id+'" class="node '+(sel?'chosen ':'')+(pair&&!pair.includes(id)?'subdued':'')+'" transform="translate('+coords(id).join(' ')+')"><title>Inspect '+esc(c.name)+'</title><rect class="hit" x="-77" y="-60" width="154" height="120" rx="15"/><g class="selection"><ellipse cx="0" cy="-5" rx="83" ry="49" fill="url(#halo)"/><path d="M-61 0 0 -29 61 0 0 29Z" stroke="'+colorOf(id)+'" stroke-dasharray="3 5" fill="none" opacity=".65"/></g><g transform="scale('+(mobile?0.65:1)+')">'+isoArt(id)+'</g><text class="name" text-anchor="middle" y="'+(mobile?29:40)+'">'+esc(c.name)+'</text><text class="sub" text-anchor="middle" y="'+(mobile?44:57)+'">'+esc(c.symbol)+'</text></g>'}).join('')+'</g></svg>'
}
function camera(){const g=$('#camera');if(!g)return;const cx=compactMap()?208:423;g.setAttribute('transform','translate('+(cx+state.x)+' '+(175+state.y)+') scale('+state.zoom+') translate('+(-cx)+' -175)');$('#zoomText').textContent=Math.round(state.zoom*100)+'%'}
function zoom(amount,pt={x:compactMap()?208:423,y:175}){const old=state.zoom;state.zoom=Math.max(.55,Math.min(3.25,old*amount));const cx=compactMap()?208:423;state.x=pt.x-cx-(pt.x-cx-state.x)*state.zoom/old;state.y=pt.y-175-(pt.y-175-state.y)*state.zoom/old;camera()}
function fit(){state.zoom=1;state.x=state.y=0;camera()}
function point(e){const s=$('#graph');return new DOMPoint(e.clientX,e.clientY).matrixTransform(s.getScreenCTM().inverse())}
function bindMap(){const svg=$('#graph');let last=null;
 svg.onwheel=e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.0015),point(e))};
 svg.onpointerdown=e=>{if(e.target.closest('[data-node]')||e.button!==0)return;last=point(e);svg.setPointerCapture(e.pointerId)};
 svg.onpointermove=e=>{if(!last)return;const p=point(e);state.x+=p.x-last.x;state.y+=p.y-last.y;last=p;camera()};
 svg.onpointerup=svg.onpointercancel=()=>{last=null};
 svg.onkeydown=e=>{if(['Enter',' '].includes(e.key)&&e.target.closest('[data-node]')){e.preventDefault();focusNode(e.target.closest('[data-node]').dataset.node);return}
 const offset={ArrowLeft:[30,0],ArrowRight:[-30,0],ArrowUp:[0,30],ArrowDown:[0,-30]}[e.key];if(offset){e.preventDefault();state.x+=offset[0];state.y+=offset[1];camera()}};
 camera();
}
function mapPanel(){return '<section class="panel map '+(state.expanded?'expanded':'')+'" aria-label="Architecture map"><div class="panelhead">'+icon('map')+'<h2>Architecture map</h2><div class="right"><span class="tag">7 components</span>'+button('expand','',state.expanded?'close':'expand','iconbtn bare','aria-label="'+(state.expanded?'Close expanded map':'Expand map')+'"')+'</div></div><div class="canvas">'+diagram()+'</div><div class="mapfoot"><div class="legend">'+Object.entries(colors).map(([k,c])=>'<span><i class="square" style="--color:'+c+'"></i>'+k+'</span>').join('')+'</div><div class="controls">'+button('zoom-out','','minus','','aria-label="Zoom out"')+'<output id="zoomText">100%</output>'+button('zoom-in','','plus','','aria-label="Zoom in"')+button('fit','','fit','','aria-label="Fit map" title="Fit map"')+'</div></div></section>'}
function panel(title,glyphName,content,remark=''){return '<aside class="panel inspector"><div class="panelhead">'+icon(glyphName)+'<h2>'+title+'</h2>'+remark+'</div><div class="insbody">'+content+'</div></aside>'}
function questionList(id){const n=components[id];return questions.map((q,i)=>'<details class="q"><summary>'+q+'</summary><p>'+(i===1||i===4?'<span class="tag infer">Inference</span> ':'')+esc(n[answers[i]])+'</p>'+refs(questionRefs[id][i])+'</details>').join('')}
function inspector(){const c=components[state.node],id=state.node;
 let out=kind(id)+'<div class="ctitle">'+glyph(c.icon,colorOf(id))+'<h3>'+c.name+'</h3></div>';
 if(state.questions){out+='<p class="meta" style="margin-bottom:10px">Repository-grounded questions</p>'+questionList(id)+button('questions','Component details','sliders','button');}
 else{out+='<p class="explain">'+esc(c.summary)+'</p><div class="kicker minihead">Responsibilities</div><ul class="duties">'+c.duties.map(d=>'<li>'+esc(d)+'</li>').join('')+'</ul><div class="kicker minihead">Connected components</div><div class="inslinks">'+neighbors[id].map(n=>button('neighbor',components[n].name,'','neighbor','data-nodeid="'+n+'"')).join('')+'</div><div class="kicker minihead">Source location</div><div class="inslinks">'+srcButton(c.refs[0])+'</div><div class="insactions">'+button('questions','Questions','question','button soft')+button('implementation','Inspect source','code','button')+'</div>'}
 return panel('Component inspector','sliders',out,'<span class="tag">'+String(ids.indexOf(id)+1).padStart(2,'0')+' / 07</span>')
}
function connectionInspector(){const [a,b,title,payload,why,ref]=contracts[state.contract];return panel('Connection inspector','connect','<div class="kicker">Communication contract</div><div class="ctitle"><h3>'+title+'</h3></div><div class="transition">'+components[a].name+' → <b>'+components[b].name+'</b></div><p class="explain">'+why+'</p><div class="kicker minihead">Data exchanged</div>'+tag(payload)+refs([ref])+ '<div class="insactions">'+button('endpoint','Inspect receiver','sliders','button soft','data-nodeid="'+b+'"')+'</div>')}
function flowInspector(){const f=flows[state.flow],s=f.steps[state.step],end=state.step===f.steps.length-1;
 return panel('Execution trace','route','<div class="ctype" style="--color:'+f.color+'">'+icon(f.icon)+f.name+'</div><div class="timeline">'+f.steps.map((t,i)=>'<button aria-label="Step '+(i+1)+': '+esc(t.title)+'" title="'+esc(t.title)+'" data-act="step" data-i="'+i+'" class="'+(i===state.step?'on':i<state.step?'done':'')+'"><i></i></button>').join('')+'</div><div class="kicker">Step '+(state.step+1)+' of '+f.steps.length+'</div><div class="ctitle"><h3>'+s.title+'</h3></div><p class="explain">'+esc(s.why)+'</p><div class="kicker minihead">State transition</div><div class="transition">'+esc(s.before)+' → <b>'+esc(s.after)+'</b></div><div class="kicker minihead">Payload</div><code class="meta">'+esc(s.payload)+'</code>'+refs([s.ref])+'<div class="flowcontrols">'+button('prev','','prev','iconbtn','aria-label="Previous step" '+(state.step===0?'disabled':''))+button('play',playTimer?'Pause':end?'Replay':'Run simulation',playTimer?'pause':'play','button primary')+button('next','','next','iconbtn','aria-label="Next step" '+(end?'disabled':''))+'</div>')}
function workflows(){return '<section class="flows"><div class="secthead"><h2>Execution flows</h2><span class="meta">'+icon('route')+' 4 workflows</span></div><div class="cards">'+flows.map((f,i)=>'<button class="flowcard" data-act="flow" data-i="'+i+'" style="--color:'+f.color+'"><div class="flowvisual">'+glyph(f.icon,f.color)+miniature(i)+'</div><h3>'+f.name+'</h3><div class="cmd">'+f.cmd+'</div><div class="foot"><span>'+f.steps.length+' steps</span>'+icon('play')+'</div></button>').join('')+'</div></section>'}
function context(){if(state.level===0)return '';let desc='',ctrl='';
 if(state.level===1||state.level===4){desc=state.level===1?'Choose a component to trace its dependencies.':'Choose a component to inspect its source evidence.';ctrl=subselect()}
 if(state.level===2){desc='The highlighted path shows the selected exchange.';ctrl='<select data-choice="contract" aria-label="Connection">'+optionlist(contracts.map(x=>x[2]),state.contract)+'</select>'}
 if(state.level===3){desc='The highlighted path follows the current execution step.';ctrl='<select data-choice="flow" aria-label="Workflow">'+optionlist(flows.map(x=>x.name),state.flow)+'</select>'}
 return '<div class="contextbar"><div><p>'+desc+'</p></div>'+ctrl+'</div>'}
function related(){const c=components[state.node];return '<section class="below"><div class="secthead"><h2>'+c.name+' dependencies</h2></div><div class="grid2"><article class="card"><div class="kicker">Called by / inputs</div><p>'+esc(c.incoming)+'</p>'+refs(c.extra)+'</article><article class="card"><div class="kicker">Calls / outputs</div><p>'+esc(c.outgoing)+'</p>'+refs(c.refs.slice(0,3))+'</article></div></section>'}
function connectionList(){return '<section class="below"><div class="secthead"><h2>Connections</h2>'+tag(contracts.length+' contracts')+'</div><div class="grid2">'+contracts.map(([a,b,title],i)=>'<button class="pick '+(i===state.contract?'on':'')+'" data-act="contract" data-i="'+i+'">'+icon('connect')+'<span>'+title+'<br><span class="meta">'+components[a].name+' → '+components[b].name+'</span></span></button>').join('')+'</div></section>'}
function timeline(){const f=flows[state.flow];return '<section class="below"><div class="secthead"><h2>Workflow timeline</h2><span class="meta">Illustrated execution</span></div><div class="grid2">'+f.steps.map((s,i)=>'<button class="pick '+(i===state.step?'on':'')+'" data-act="step" data-i="'+i+'"><span class="idx">'+String(i+1).padStart(2,'0')+'</span><span>'+esc(s.title)+'<br><span class="meta">'+components[s.from].name+' → '+components[s.to].name+'</span></span></button>').join('')+'</div></section>'}
function implementation(){const c=components[state.node];return '<section class="below"><div class="secthead"><h2>'+c.name+' implementation</h2>'+tag('Local source')+'</div><div class="grid2"><article class="card"><h3>Implementation evidence</h3><p>'+esc(c.relation)+'</p>'+refs([...c.refs,...c.extra])+'</article><article class="card"><h3>Component questions</h3>'+questionList(state.node)+'</article></div></section>'}
function decisionPage(){return '<div class="grid2 decisiongrid">'+decisions.map(([ico,title,behavior,trade,label,...sources])=>'<article class="card"><div class="decrow">'+glyph(ico,'#91dfb0')+'<h3>'+title+'</h3></div><div class="kicker">Verified behavior</div><p>'+esc(behavior)+'</p><div class="kicker">'+esc(label)+' · trade-off</div><p>'+esc(trade)+'</p>'+refs(sources)+'</article>').join('')+'</div>'}
function codeText(line){const tokens=/(\/\/.*$|^\s*#\s+.*$|"(?:\\.|[^"\\])*"|\b(?:const|auto|return|if|else|void|int|struct|class|bool|for|throw|try|catch|std|namespace|while)\b)/g;let out='',i=0;for(const m of line.matchAll(tokens)){out+=esc(line.slice(i,m.index))+'<span class="'+(m[0].startsWith('//')||m[0].trimStart().startsWith('#')?'comment':m[0].startsWith('"')?'str':'token')+'">'+esc(m[0])+'</span>';i=m.index+m[0].length}return out+esc(line.slice(i))}
function codePane(ref,full=false){const [file,start,end]=ref,lines=repo.files[file].split('\n');if(lines.at(-1)==='')lines.pop();const lo=full?1:Math.max(start-2,1),hi=full?lines.length:Math.min(end+2,lines.length);return '<div class="sourcebar">'+icon('file')+esc(file)+'<span class="spacer"></span><span class="meta">L'+lo+'–'+hi+'</span></div><pre tabindex="0" class="codelines" aria-label="Numbered source lines">'+lines.slice(lo-1,hi).map((line,i)=>'<span class="line '+(start<=lo+i&&lo+i<=end?'focus':'')+'" data-line="'+(lo+i)+'"><span class="lineno">'+(lo+i)+'</span>'+codeText(line)+'</span>').join('')+'</pre>'}
const scopeText='The source index includes every tracked file at '+repo.revision+', including all three C++ translation units, both headers, build files, shell completion, systemd units, and architecture diagrams. The diagrams group code by responsibility. Runtime-tool behavior is described at its integration points. The interactive traces are source-based simulations. Local editor sessions, build artifacts, and untracked HTML guides are outside the runtime analysis.';
function sourcePage(){const files=Object.keys(repo.files);return '<div class="indexgrid"><section class="panel"><div class="panelhead">'+icon('repo')+'<h2>Repository files</h2>'+tag(files.length+' files')+'</div><div class="insbody">'+files.map(f=>button('file',esc(f),'file','sourceitem '+(state.src===f?'on':''),'data-file="'+esc(f)+'"')).join('')+'</div></section><section class="panel sourcepane">'+codePane([state.src,0,0],true)+'</section></div><section class="card scope"><h3>Analysis coverage</h3><p>'+scopeText+'</p><p>The tracked tree contains no test suite. Optional autosave requires the supplied systemd user units to be installed and enabled. The plugin checkout and external binaries are supplied by the user.</p></section><div class="grid2"><article class="card"><h3>Other CLI operations</h3><p>init writes a template. config prints the editable path. list reports running, saved, or configured. kill stops the named server without first saving. delete removes the .work definition and leaves project state on disk.</p>'+refs([M(354,367),M(460,470),M(501,525)])+'</article><article class="card"><h3>Automation and completion</h3><p>The five-minute timer starts a oneshot save. Session shutdown attempts the same command. Batch save iterates configured names, skips stopped projects, and counts per-project save failures. Bash completion reads project filenames directly.</p>'+refs([M(442,458),["contrib/systemd/work-autosave.timer",4,7],["contrib/systemd/work-autosave.service",4,6],["contrib/systemd/work-save-on-shutdown.service",5,10],["completions/bash/work",14,25]])+'</article></div>'}
function render(){
 const inMap=state.page==='map',isDec=state.page==='decisions';
 document.body.classList.toggle('expanding',state.expanded);
 $('#topnav').innerHTML=[['map','Architecture','map'],['decisions','Decisions','layers'],['sources','Source index','code']].map(([key,t,ic])=>button('page',t,ic,state.page===key?'on':'','data-page="'+key+'" '+(state.page===key?'aria-current="page"':''))).join('');
 $('#tourBtn').innerHTML=icon('tour')+(state.tour===-1?'Guided tour':'End tour');
 $('#crumb').innerHTML=icon('repo')+'terminal_multiplexer <span>/</span> '+(inMap?'Architecture':isDec?'Decisions':'Source index');
 $('#title').textContent=inMap?headings[state.level]:isDec?'Architecture decisions':'Source index';
 $('#subtitle').textContent=inMap?descriptions[state.level]:isDec?'Explore the design choices, their consequences, and the code behind them.':'Read the repository snapshot and follow implementation references offline.';
 $('#levels').style.display=inMap?'':'none';
 $('#levels').innerHTML=levels.map((v,i)=>button('level','<span class="idx">0'+(i+1)+'</span>'+v,'',i===state.level?'on':'','data-i="'+i+'" '+(i===state.level?'aria-current="step"':''))).join('');
 $('#tour').innerHTML=state.tour<0?'':'<div class="tourbox" aria-live="polite">'+icon('tour')+'<div><div class="kicker">Guided tour · '+(state.tour+1)+' / '+tours.length+'</div><strong>'+tours[state.tour][2]+'</strong><p>'+tours[state.tour][3]+'</p></div>'+button('tour-prev','Back','','button',state.tour===0?'disabled':'')+button('tour-next',state.tour===tours.length-1?'Finish':'Continue','','button primary')+'</div>';
 $('#content').innerHTML=inMap?context()+'<div class="workspace">'+mapPanel()+(state.level===3?flowInspector():state.level===2?connectionInspector():inspector())+'</div>'+[workflows,related,connectionList,timeline,implementation][state.level]():isDec?decisionPage():sourcePage();
 if(inMap)bindMap();
}
function displaySource(){const [f,a,b]=sourceRef;$('#dialogCode').innerHTML=codePane(sourceRef,state.sourceFull)+'<div class="dialogfoot">'+button('toggle-source',state.sourceFull?'Show excerpt':'Show full file','code','button')+'<a href="'+esc(f)+'" target="_blank" rel="noopener">Open local file</a></div>';if(state.sourceFull){const pre=$('#dialogCode pre'),ln=pre.querySelector('[data-line="'+a+'"]');if(ln)pre.scrollTop=ln.offsetTop-pre.offsetTop-40}}
function showSource(ref){stop();if(state.level===3&&state.page==='map')render();sourceRef=ref;state.sourceFull=false;displaySource();$('#sourceDialog').showModal()}
const actions={
 home:()=>{Object.assign(state,{level:0,node:'cli',questions:false,x:0,y:0,zoom:1});changePage('map')},
 page:d=>changePage(d.page),level:d=>setLevel(+d.i),tour:()=>state.tour<0?startTour():startTour(-1),'tour-prev':()=>startTour(state.tour-1),'tour-next':()=>startTour(state.tour+1),
 questions:()=>{state.questions=!state.questions;render()},implementation:()=>{setLevel(4);$('.below').scrollIntoView({block:'start'})},
 source:d=>showSource(JSON.parse(d.ref)),'close-source':()=>$('#sourceDialog').close(),'toggle-source':()=>{state.sourceFull=!state.sourceFull;displaySource()},
 neighbor:d=>focusNode(d.nodeid),flow:d=>beginFlow(+d.i),contract:d=>{state.contract=+d.i;render();$('.workspace').scrollIntoView({block:'start'})},endpoint:d=>{state.node=d.nodeid;setLevel(1)},
 step:d=>{stop();chooseStep(+d.i)},prev:()=>{stop();chooseStep(state.step-1)},next:()=>{stop();chooseStep(state.step+1)},
 play:()=>{if(playTimer){stop();render();return}const last=flows[state.flow].steps.length-1;if(state.step===last)state.step=0;playTimer=setInterval(()=>{if(state.step+1>=last)stop();chooseStep(state.step+1)},3800);render()},
 file:d=>{state.src=d.file;render()},'zoom-in':()=>zoom(1.2),'zoom-out':()=>zoom(1/1.2),fit,
 expand:()=>{state.expanded=!state.expanded;render();$('[data-act="expand"]').focus()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el){actions[el.dataset.act]?.(el.dataset);return}const node=e.target.closest('[data-node]');if(node){focusNode(node.dataset.node);if(state.expanded){state.expanded=false;render()}if(window.matchMedia('(max-width:760px)').matches)$('.inspector')?.scrollIntoView({block:'nearest'})}});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset.choice)return;const i=+el.value;if(el.dataset.choice==='node')focusNode(ids[i]);if(el.dataset.choice==='contract'){state.contract=i;render()}if(el.dataset.choice==='flow')beginFlow(i)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.expanded&&!$('#sourceDialog').open){state.expanded=false;render();$('[data-act="expand"]').focus()}});
window.matchMedia('(max-width:560px)').addEventListener('change',()=>{state.zoom=1;state.x=state.y=0;render()});
$('#sourceDialog').addEventListener('click',e=>{if(e.target===$('#sourceDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
$('#sourceDialog [data-act="close-source"]').innerHTML=icon('close');$('#footrepo').innerHTML=icon('branch')+'terminal_multiplexer';$('#revision').textContent=repo.revision;render();

</script></body></html>
